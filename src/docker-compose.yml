services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: kartprosjekt-sqlserver
    restart: unless-stopped

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Password is required}"

    ports:
      - "127.0.0.1:1433:1433"

    volumes:
      - sqlserver_data:/var/opt/mssql

volumes:
  sqlserver_data: